services:
  cupsd:
    image: bartekmp/cupsane:latest
    container_name: cupsane
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./storage/cups-config:/etc/cups
      - ./storage/cups-cache:/var/cache/cups
      - ./storage/cups-spool:/var/spool/cups
    environment:
      - TZ=Europe/Warsaw
      - MDNS_ANNOUNCE=false
      - AIRSANE_DEBUG=${AIRSANE_DEBUG:-true}
      - AIRSANE_LISTEN_PORT=${AIRSANE_LISTEN_PORT:-8090}
      - ANNOUNCE_SECURE=${ANNOUNCE_SECURE:-false}
      - ANNOUNCE_BASE_URL=${ANNOUNCE_BASE_URL:-}
      - AVAHI_HOST_NAME=${AVAHI_HOST_NAME:-}
      - AVAHI_DOMAIN=${AVAHI_DOMAIN:-local}
      - AIRSANE_ACCESS_NETWORK=${AIRSANE_ACCESS_NETWORK:-}
