apiVersion: apps/v1
kind: Deployment
metadata:
  name: cupsane
  labels:
    app: cupsane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cupsane
  template:
    metadata:
      labels:
        app: cupsane
    spec:
      nodeSelector:
        kubernetes.io/hostname: workstation
      containers:
        - name: cupsane
          image: bartekmp/cupsane:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          env:
            - name: MDNS_ANNOUNCE
              value: "false"
            - name: ANNOUNCE_SECURE
              value: "false"
            - name: ANNOUNCE_BASE_URL
              value: ""
          ports:
            - containerPort: 631
              hostPort: 8631
              name: ipp
            - containerPort: 8090
              hostPort: 8090
              name: airsane
          volumeMounts:
            - name: dbus-run
              mountPath: /var/run/dbus
            - name: usb-bus
              mountPath: /dev/bus/usb
            - name: cups-config
              mountPath: /etc/cups
            - name: cups-cache
              mountPath: /var/cache/cups
            - name: cups-spool
              mountPath: /var/spool/cups
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:631/ >/dev/null && curl -fsS http://127.0.0.1:8090/ >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:631/ >/dev/null && curl -fsS http://127.0.0.1:8090/ >/dev/null
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dbus-run
          hostPath:
            path: /var/run/dbus
        - name: usb-bus
          hostPath:
            path: /dev/bus/usb
        - name: cups-config
          hostPath:
            path: /opt/cupsd-data/config
        - name: cups-cache
          hostPath:
            path: /opt/cupsd-data/cache
        - name: cups-spool
          hostPath:
            path: /opt/cupsd-data/spool
---
apiVersion: v1
kind: Service
metadata:
  name: cupsane
  labels:
    app: cupsane
spec:
  selector:
    app: cupsane
  ports:
    - name: ipp
      port: 8631
      targetPort: 631
    - name: airsane
      port: 8090
      targetPort: 8090
